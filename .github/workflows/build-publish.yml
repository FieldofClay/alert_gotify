name: Build and Publish

on:
  release:
    types:
      - published

env:
  PYTHON_VERSION: '3.13'

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Tag Name
        id: extract_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version in globalConfig.json
        run: |
          VERSION="${TAG_NAME#v}"
          jq --arg version "$VERSION" '.meta.version = $version' alert_gotify/globalConfig.json > alert_gotify/globalConfig.json.tmp
          mv alert_gotify/globalConfig.json.tmp alert_gotify/globalConfig.json

      - name: Commit version update
        run: |
          git add alert_gotify/globalConfig.json
          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "chore(release): update globalConfig.json version to ${{ env.TAG_NAME }}"
            git push origin HEAD:${{ github.event.release.target_commitish }}
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UCC
        run: pip install splunk-add-on-ucc-framework

      - name: Build add-on
        run: ucc-gen build --source alert_gotify/package --ta-version ${{ env.TAG_NAME }}
      
      - name: Package add-on
        run: ucc-gen package --path output/alert_gotify
      
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: alert_gotify-${{ env.TAG_NAME }}.tar.gz
      
      - name: Publish to Splunkbase
        if: vars.SPLUNKBASE_APP_ID != ''
        run: |
          ucc-gen publish \
            --package-path alert_gotify-${{ env.TAG_NAME }}.tar.gz \
            --username ${{ secrets.SPLUNKBASE_USERNAME }} \
            --password "${{ secrets.SPLUNKBASE_PASSWORD }}" \
            --app-id ${{ vars.SPLUNKBASE_APP_ID }} \
            --splunk-versions ${{ vars.SPLUNK_VERSIONS }} \
            --cim-versions ${{ vars.CIM_VERSIONS }}
